id: gosleigh.realexe.measure_all
revision: 1
summary: Measure every realexe work (or the named ones) with one goldengap build and --jobs processes; prints only works that are not all-MATCH, then the tally
use_when:
  - checking a change to the default (non-opt-in) decompile path against all real-binary seeds before a release
tags: [realexe, golden, measurement, parity]
execution:
  kind: cli
  executable_ref: py
  cwd: .
  argv_template: [-3, tools/realexe/realexe.py, measure-all, --jobs, "{jobs}"]
  trusted_for_run: true
  timeout_sec: 7200
  artifact_mode: metadata
  preflight:
    - {id: py.version, kind: executable, ref: py, requirement: required, argv: [-3, --version]}
    - {id: go.version, kind: executable, ref: go, requirement: required, argv: [version]}
arguments:
  jobs: {type: string, required: true, description: "decompiler processes run at once, 1-4 (2 is the CLI default)"}
inputs: [tools/realexe/realexe.py, cmd/goldengap/main.go, "pkg/**/*.go"]
outputs: ["local/realexe/*/GAPMAP.md", "local/realexe/*/gapmap.json"]
docs: [docs/GOAL_REALEXE.md]
cache_policy: disabled
