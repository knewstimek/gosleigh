id: gosleigh.realexe.sample
revision: 1
summary: Dump a deterministic size-stratified function sample (Ghidra C + committed prototype) from an analyzed realexe work dir
use_when:
  - after realexe.analyze, or to change sample size/seed
tags: [realexe, golden, ghidra, corpus]
execution:
  kind: cli
  executable_ref: py
  cwd: .
  argv_template: [-3, tools/realexe/realexe.py, sample, --work, "{work}", --n, "{n}", --seed, "{seed}"]
  trusted_for_run: true
  timeout_sec: 10800
  artifact_mode: metadata
  preflight:
    - {id: py.version, kind: executable, ref: py, requirement: required, argv: [-3, --version]}
arguments:
  work: {type: string, required: true, description: realexe work directory}
  n: {type: string, required: true, description: Number of functions to sample (baseline 200)}
  seed: {type: string, required: true, description: Sampling seed (baseline 1)}
inputs: [tools/realexe/realexe.py, tools/realexe/GenSample.java]
docs: [docs/GOAL_REALEXE.md]
cache_policy: disabled
