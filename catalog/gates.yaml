id: gosleigh.gates
revision: 1
summary: Run every golden gate (go test, env-gated loader golden maps, x64_auto goldengap) and print one line per gate
use_when:
  - before landing any engine change (all gates must stay at baseline)
  - to re-check the regression baseline after a rebase or merge
tags: [verification, golden, regression]
execution:
  kind: cli
  executable_ref: py
  cwd: .
  argv_template: [-3, tools/gates.py]
  trusted_for_run: true
  timeout_sec: 3600
  artifact_mode: metadata
  preflight:
    - {id: py.version, kind: executable, ref: py, requirement: required, argv: [-3, --version]}
    - {id: go.version, kind: executable, ref: go, requirement: required, argv: [version]}
inputs: [tools/gates.py, tools/goldengap/goldengap.py, "pkg/**/*.go", "testdata/**"]
checks: [golden.x64_auto, golden.loader_maps, go.test]
docs: [docs/GOAL_REALEXE.md, tools/goldengap/README.md]
cache_policy: disabled
